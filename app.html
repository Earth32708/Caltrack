<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalTrack — Daily log</title>

  <!-- Fonts (same pairing as the landing page) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       1. DESIGN TOKENS — same system as the landing page
       ========================================================== */
    :root {
      --green:       #0E7A5F;
      --green-dark:  #0A5C47;
      --green-soft:  #E3F2EC;
      --coral:       #E8744F;
      --coral-soft:  #FBEAE3;
      --bg:          #FAFAF7;
      --surface:     #FFFFFF;
      --text:        #1F2937;
      --text-muted:  #6B7280;
      --border:      #E5E7EB;
      --error:       #DC2626;
      --warning:     #B45309;

      --radius: 12px;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;

      --font-heading: "Plus Jakarta Sans", sans-serif;
      --font-body: "Inter", sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    h1, h2, h3 { font-family: var(--font-heading); line-height: 1.2; }

    .container { max-width: 560px; margin: 0 auto; padding: var(--space-3); }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 2px;
    }

    /* ==========================================================
       2. SHARED PIECES: buttons, inputs, cards
       ========================================================== */
    .btn {
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-dark); }

    .btn-secondary {
      background: transparent;
      color: var(--green);
      border: 1.5px solid var(--green);
    }
    .btn-secondary:hover { background: var(--green-soft); }

    .btn-small {
      font-size: 13px;
      padding: 6px 12px;
    }

    .btn-block { width: 100%; }

    input, select {
      font-family: var(--font-body);
      font-size: 16px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      width: 100%;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .field { margin-bottom: var(--space-2); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .message {
      font-size: 14px;
      margin-top: var(--space-1);
      min-height: 22px;
    }
    .message.error   { color: var(--error); }
    .message.success { color: var(--green); }

    .hidden { display: none; }

    /* ==========================================================
       3. SIGN UP / LOG IN VIEWS
       ========================================================== */
    .auth-wrap { max-width: 420px; margin: 48px auto 0; padding: 0 var(--space-2); }

    .auth-logo {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 24px;
      text-align: center;
      margin-bottom: var(--space-3);
    }
    .auth-logo span { color: var(--green); }

    .auth-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .auth-sub { font-size: 14px; color: var(--text-muted); margin-bottom: var(--space-2); }

    .auth-switch {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: var(--space-2);
    }
    .auth-switch a { color: var(--green); font-weight: 500; }

    /* ==========================================================
       4. APP VIEW (after login)
       ========================================================== */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-3);
    }
    .app-header .who { font-size: 13px; color: var(--text-muted); }

    .summary-numbers {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: var(--space-1);
    }
    .summary-eaten {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 28px;
    }
    .summary-target { font-size: 14px; color: var(--text-muted); }

    .progress-track {
      height: 10px;
      background: var(--green-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .progress-fill.over { background: var(--coral); }

    .summary-note {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: var(--space-1);
    }

    /* --- Add food form --- */
    .add-form-row {
      display: grid;
      grid-template-columns: 1fr 110px 130px;
      gap: var(--space-1);
      align-items: end;
    }

    /* NEW: the food field needs to be "relative" so the dropdown
       of suggestions can sit directly underneath it. */
    .food-field { position: relative; }

    /* NEW: the dropdown list of food suggestions */
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 20;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 4px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
      max-height: 260px;
      overflow-y: auto;
    }

    .suggestion-item {
      display: flex;
      justify-content: space-between;
      gap: var(--space-1);
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .suggestion-item:hover { background: var(--green-soft); }
    .suggestion-item .s-cal { color: var(--text-muted); white-space: nowrap; }

    .suggestion-empty {
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* NEW: helper line under the form, e.g. "Auto-filled..." */
    .food-hint {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: var(--space-1);
      min-height: 20px;
    }

    /* --- Entries list --- */
    .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-1);
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .entry-row:first-of-type { border-top: none; }

    .entry-meal {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: var(--green);
      background: var(--green-soft);
      border-radius: 999px;
      padding: 2px 8px;
      margin-right: 6px;
    }

    .entry-kcal { color: var(--text-muted); white-space: nowrap; }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .delete-btn:hover { color: var(--error); background: var(--coral-soft); }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: var(--space-3) 0;
    }

    @media (max-width: 560px) {
      .add-form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ===================== SIGN UP / LOG IN ===================== -->
  <div id="auth-view" class="auth-wrap hidden">
    <p class="auth-logo">Cal<span>Track</span></p>

    <!-- SIGN UP CARD -->
    <div id="signup-card" class="card">
      <h2 class="auth-title">Create your account</h2>
      <p class="auth-sub">Track every meal in seconds — free.</p>

      <div class="field">
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" autocomplete="email" placeholder="you@gmail.com">
      </div>
      <div class="field">
        <label for="signup-password">Create a password</label>
        <input id="signup-password" type="password" autocomplete="new-password" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label for="signup-confirm">Confirm password</label>
        <input id="signup-confirm" type="password" autocomplete="new-password" placeholder="Type it again">
      </div>

      <button id="signup-btn" class="btn btn-primary btn-block">Create account</button>
      <p id="signup-message" class="message"></p>

      <p class="auth-switch">Already have an account? <a href="#" id="go-login">Log in</a></p>
    </div>

    <!-- LOG IN CARD -->
    <div id="login-card" class="card hidden">
      <h2 class="auth-title">Welcome back</h2>
      <p class="auth-sub">Log in to see today's meals.</p>

      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" placeholder="you@gmail.com">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="Your password">
      </div>

      <button id="login-btn" class="btn btn-primary btn-block">Log in</button>
      <p id="login-message" class="message"></p>

      <p class="auth-switch">New here? <a href="#" id="go-signup">Create an account</a></p>
    </div>
  </div>

  <!-- ===================== APP (after login) ===================== -->
  <div id="app-view" class="container hidden">

    <div class="app-header">
      <div>
        <h2 id="today-heading">Today</h2>
        <p class="who" id="user-email"></p>
      </div>
      <button id="logout-btn" class="btn btn-secondary btn-small">Log out</button>
    </div>

    <!-- Daily summary -->
    <div class="card">
      <div class="summary-numbers">
        <span class="summary-eaten"><span id="total-kcal">0</span> kcal</span>
        <span class="summary-target">target: <span id="target-kcal"></span> kcal</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="summary-note" class="summary-note"></p>
    </div>

    <!-- Add food -->
    <div class="card">
      <div class="add-form-row">
        <!-- The food field holds the input AND the suggestions dropdown -->
        <div class="food-field">
          <label for="food-name">Food</label>
          <input id="food-name" type="text" autocomplete="off" placeholder="Start typing, e.g. pad krapow">
          <div id="food-suggestions" class="suggestions hidden"></div>
        </div>
        <div>
          <label for="food-kcal">Calories</label>
          <input id="food-kcal" type="number" min="0" placeholder="auto">
        </div>
        <div>
          <label for="food-meal">Meal</label>
          <select id="food-meal">
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snack">Snack</option>
          </select>
        </div>
      </div>
      <p id="food-hint" class="food-hint"></p>
      <div>
        <button id="add-btn" class="btn btn-primary">Add to log</button>
      </div>
      <p id="add-message" class="message"></p>
    </div>

    <!-- Today's entries -->
    <div class="card">
      <h3 style="font-size:17px; margin-bottom: var(--space-1);">Logged today</h3>
      <div id="entries-list"></div>
    </div>

  </div>

  <!-- Supabase JavaScript library, loaded from a CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* ==========================================================
       1. YOUR SUPABASE PROJECT DETAILS
       (Already filled in. The anon key is SAFE to be here.
        Never put the "service_role" key in this file.)
       ========================================================== */
    const SUPABASE_URL = "https://xzmauonotullyizgncas.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6bWF1b25vdHVsbHlpemduY2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzM2NTksImV4cCI6MjA5Njc0OTY1OX0.kRZp7eDwqpSBBZn9zALu5OvmCnHKtLnYs6GNVFs37Us";

    /* Daily calorie target — calculated from a profile in a later step. */
    const DAILY_TARGET = 2000;

    /* ==========================================================
       2. SETUP
       ========================================================== */
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);

    /* ==========================================================
       3. SHOWING THE RIGHT VIEW (sign up / log in / app)
       ========================================================== */
    db.auth.onAuthStateChange((event, session) => {
      if (session) { showApp(session.user); } else { showAuth(); }
    });

    function showAuth() {
      $("auth-view").classList.remove("hidden");
      $("app-view").classList.add("hidden");
      showSignup();
    }
    function showSignup() {
      $("signup-card").classList.remove("hidden");
      $("login-card").classList.add("hidden");
    }
    function showLogin() {
      $("login-card").classList.remove("hidden");
      $("signup-card").classList.add("hidden");
    }
    $("go-login").addEventListener("click", (e) => { e.preventDefault(); showLogin(); });
    $("go-signup").addEventListener("click", (e) => { e.preventDefault(); showSignup(); });

    function showApp(user) {
      $("auth-view").classList.add("hidden");
      $("app-view").classList.remove("hidden");
      $("user-email").textContent = user.email;
      $("target-kcal").textContent = DAILY_TARGET.toLocaleString();
      $("today-heading").textContent = new Date().toLocaleDateString(undefined, {
        weekday: "long", day: "numeric", month: "long"
      });
      loadEntries();
    }

    /* ==========================================================
       4. SIGN UP
       ========================================================== */
    $("signup-btn").addEventListener("click", async () => {
      const email = $("signup-email").value.trim();
      const password = $("signup-password").value;
      const confirm = $("signup-confirm").value;

      if (!email.includes("@") || !email.includes(".")) {
        return showMessage("signup-message", "Please enter a valid email address.", "error");
      }
      if (password.length < 6) {
        return showMessage("signup-message", "Your password needs at least 6 characters.", "error");
      }
      if (password !== confirm) {
        return showMessage("signup-message", "The two passwords don't match — please retype them.", "error");
      }

      const { data, error } = await db.auth.signUp({ email, password });
      if (error) return showMessage("signup-message", error.message, "error");
      if (!data.session) {
        showMessage("signup-message", "Account created! Check your email to confirm, then log in.", "success");
      }
    });

    /* ==========================================================
       5. LOG IN / LOG OUT
       ========================================================== */
    $("login-btn").addEventListener("click", async () => {
      const email = $("login-email").value.trim();
      const password = $("login-password").value;
      if (!email || !password) {
        return showMessage("login-message", "Please fill in both boxes.", "error");
      }
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        const friendly = error.message.includes("Invalid")
          ? "Email or password is incorrect. Please try again."
          : error.message;
        showMessage("login-message", friendly, "error");
      }
    });
    $("logout-btn").addEventListener("click", () => db.auth.signOut());

    /* ==========================================================
       6. FOOD SEARCH (the new part)
       As the user types, we look up matching foods in the
       "foods" table and show them in a dropdown. Picking one
       fills in the calories automatically.
       ========================================================== */
    let searchTimer = null;

    $("food-name").addEventListener("input", () => {
      const query = $("food-name").value.trim();
      $("food-hint").textContent = "";   // typing again clears the old hint

      // Wait until there are at least 2 letters, and pause briefly so
      // we don't search on every single keystroke.
      clearTimeout(searchTimer);
      if (query.length < 2) { hideSuggestions(); return; }
      searchTimer = setTimeout(() => searchFoods(query), 200);
    });

    async function searchFoods(query) {
      const { data: foods, error } = await db
        .from("foods")
        .select("name, calories, serving")
        .ilike("name", "%" + query + "%")   // case-insensitive "contains"
        .order("name", { ascending: true })
        .limit(8);

      if (error) { hideSuggestions(); return; }
      renderSuggestions(foods);
    }

    function renderSuggestions(foods) {
      const box = $("food-suggestions");
      box.innerHTML = "";

      if (!foods || foods.length === 0) {
        box.innerHTML = '<div class="suggestion-empty">No match — just type the calories yourself.</div>';
        box.classList.remove("hidden");
        return;
      }

      for (const food of foods) {
        const item = document.createElement("div");
        item.className = "suggestion-item";

        const name = document.createElement("span");
        name.textContent = food.name;

        const cal = document.createElement("span");
        cal.className = "s-cal";
        cal.textContent = food.calories.toLocaleString() + " kcal · " + food.serving;

        item.appendChild(name);
        item.appendChild(cal);
        item.addEventListener("click", () => pickFood(food));
        box.appendChild(item);
      }
      box.classList.remove("hidden");
    }

    // When a suggestion is clicked: fill in the name and calories.
    function pickFood(food) {
      $("food-name").value = food.name;
      $("food-kcal").value = food.calories;
      $("food-hint").textContent =
        "Auto-filled from the food list (" + food.serving + "). You can adjust the calories if your portion was different.";
      hideSuggestions();
    }

    function hideSuggestions() {
      const box = $("food-suggestions");
      box.classList.add("hidden");
      box.innerHTML = "";
    }

    // Close the dropdown if the user clicks anywhere outside the food field.
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".food-field")) hideSuggestions();
    });

    /* ==========================================================
       7. LOADING TODAY'S ENTRIES
       ========================================================== */
    async function loadEntries() {
      const today = new Date().toISOString().slice(0, 10);
      const { data: entries, error } = await db
        .from("log_entries")
        .select("*")
        .eq("eaten_on", today)
        .order("created_at", { ascending: true });

      if (error) {
        showMessage("add-message", "Could not load entries: " + error.message, "error");
        return;
      }
      renderEntries(entries);
    }

    /* ==========================================================
       8. ADDING AN ENTRY
       ========================================================== */
    $("add-btn").addEventListener("click", async () => {
      const name = $("food-name").value.trim();
      const kcal = parseInt($("food-kcal").value, 10);

      if (!name) return showMessage("add-message", "Please enter a food name.", "error");
      if (isNaN(kcal) || kcal < 0) return showMessage("add-message", "Please enter the calories (or pick a food from the list).", "error");

      const { data: { user } } = await db.auth.getUser();
      const { error } = await db.from("log_entries").insert({
        user_id: user.id,
        food_name: name,
        calories: kcal,
        meal: $("food-meal").value,
      });

      if (error) return showMessage("add-message", "Could not save: " + error.message, "error");

      $("food-name").value = "";
      $("food-kcal").value = "";
      $("food-hint").textContent = "";
      showMessage("add-message", "Added!", "success");
      loadEntries();
    });

    /* ==========================================================
       9. DELETING AN ENTRY
       ========================================================== */
    async function deleteEntry(id) {
      const { error } = await db.from("log_entries").delete().eq("id", id);
      if (error) return showMessage("add-message", "Could not delete: " + error.message, "error");
      loadEntries();
    }

    /* ==========================================================
       10. DRAWING THE LIST AND THE SUMMARY BAR
       ========================================================== */
    function renderEntries(entries) {
      const list = $("entries-list");
      list.innerHTML = "";

      if (entries.length === 0) {
        list.innerHTML = '<p class="empty-state">Nothing logged yet — add your first food above.</p>';
      }

      let total = 0;
      for (const entry of entries) {
        total += entry.calories;

        const row = document.createElement("div");
        row.className = "entry-row";

        const left = document.createElement("span");
        const mealTag = document.createElement("span");
        mealTag.className = "entry-meal";
        mealTag.textContent = entry.meal;
        left.appendChild(mealTag);
        left.appendChild(document.createTextNode(entry.food_name));

        const right = document.createElement("span");
        right.className = "entry-kcal";
        right.textContent = entry.calories.toLocaleString() + " kcal";

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "✕";
        del.setAttribute("aria-label", "Delete " + entry.food_name);
        del.addEventListener("click", () => deleteEntry(entry.id));

        row.appendChild(left);
        row.appendChild(right);
        row.appendChild(del);
        list.appendChild(row);
      }
      updateSummary(total);
    }

    function updateSummary(total) {
      $("total-kcal").textContent = total.toLocaleString();
      const percent = Math.min((total / DAILY_TARGET) * 100, 100);
      const fill = $("progress-fill");
      fill.style.width = percent + "%";
      fill.classList.toggle("over", total > DAILY_TARGET);

      const note = $("summary-note");
      if (total > DAILY_TARGET) {
        note.textContent = (total - DAILY_TARGET).toLocaleString() + " kcal over target — tomorrow is a fresh start.";
      } else {
        note.textContent = (DAILY_TARGET - total).toLocaleString() + " kcal remaining today.";
      }
    }

    function showMessage(id, text, type) {
      const el = $(id);
      el.textContent = text;
      el.className = "message " + type;
      if (type === "success") setTimeout(() => { el.textContent = ""; }, 2500);
    }
  </script>
</body>
</html>
